name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Expected semver (e.g. 1.3.0)"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml workspace version
        run: |
          sed -i '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo update -w

      - name: Update package.json version
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh repo sync troycdc/cdcx-cli --source crypto-com/cdcx-cli --branch main

      - name: Create branch on fork
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          BRANCH="chore/bump-v${{ inputs.version }}"
          BASE_SHA=$(gh api "/repos/troycdc/cdcx-cli/git/ref/heads/main" --jq '.object.sha')
          gh api "/repos/troycdc/cdcx-cli/git/refs" \
            -f "ref=refs/heads/${BRANCH}" \
            -f "sha=${BASE_SHA}" 2>/dev/null || \
          gh api "/repos/troycdc/cdcx-cli/git/refs/heads/${BRANCH}" \
            -X PATCH -f "sha=${BASE_SHA}" -F "force=true"

      - name: Create signed commit on fork
        uses: planetscale/ghcommit-action@v0.2.20
        with:
          commit_message: "chore: bump version to ${{ inputs.version }}"
          repo: troycdc/cdcx-cli
          branch: "chore/bump-v${{ inputs.version }}"
          file_pattern: "Cargo.toml Cargo.lock package.json"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --repo crypto-com/cdcx-cli \
            --head "troycdc:chore/bump-v${{ inputs.version }}" \
            --base main \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "Automated version bump to ${{ inputs.version }}."
